name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev qt6-declarative-dev qt6-wayland liblayershellqtinterface-dev \
            qt6-base-dev-tools qt6-declarative-dev-tools \
            libgl1-mesa-dev libfuse2

      - name: Build the Qt UI
        run: |
          cmake -S ui-qt -B ui-qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui-qt/build -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/silisten" \
                   "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"

          cp ui-qt/build/silisten-qt "$APPDIR/usr/bin/"
          cp -r ui-qt/build/qml "$APPDIR/usr/bin/qml"
          cp -r silisten "$APPDIR/usr/share/silisten/"
          cp requirements.txt "$APPDIR/usr/share/silisten/"
          cp packaging/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/silisten.desktop "$APPDIR/usr/share/applications/"
          cp packaging/silisten.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/silisten.svg"
          cp packaging/silisten.svg "$APPDIR/silisten.svg"

      - name: Fetch AppImage tools
        run: |
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME#v}" | tr -cd '0-9A-Za-z._-')" >> "$GITHUB_ENV"

      - name: Build AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui-qt/qml
          EXTRA_QT_MODULES: core;gui;qml;quick;quickcontrols2;network
          QMAKE: /usr/lib/qt6/bin/qmake
          QT_SELECT: qt6
        run: |
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/silisten-qt \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/silisten.desktop \
            --icon-file AppDir/silisten.svg
          ./appimagetool AppDir "Silisten-${VERSION:-dev}-x86_64.AppImage"

      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix=Silisten/ -o "Silisten-${VERSION:-dev}-source.tar.gz" HEAD
          git archive --format=zip --prefix=Silisten/ -o "Silisten-${VERSION:-dev}-source.zip" HEAD

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Silisten-*-x86_64.AppImage
            Silisten-*-source.tar.gz
            Silisten-*-source.zip
          generate_release_notes: true

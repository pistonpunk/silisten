name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      contents: write
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git file zip \
            build-essential cmake \
            qt6-base-dev qt6-declarative-dev qt6-wayland liblayershellqtinterface-dev \
            qt6-base-dev-tools qt6-declarative-dev-tools \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            qml6-module-qtquick-shapes \
            libgl1-mesa-dev

      - name: Build the Qt UI
        run: |
          cmake -S ui-qt -B ui-qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ui-qt/build -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/silisten" \
                   "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"

          cp ui-qt/build/silisten-qt "$APPDIR/usr/bin/"
          cp -r ui-qt/build/qml "$APPDIR/usr/bin/qml"
          cp -r "$(qmake6 -query QT_INSTALL_QML)" "$APPDIR/usr/qml"
          mkdir -p "$APPDIR/usr/lib"
          cp -a $(qmake6 -query QT_INSTALL_LIBS)/libQt6*.so.6* "$APPDIR/usr/lib/"
          cp -r silisten "$APPDIR/usr/share/silisten/"
          cp requirements.txt "$APPDIR/usr/share/silisten/"
          cp packaging/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/silisten.desktop "$APPDIR/usr/share/applications/"
          cp packaging/silisten.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/silisten.svg"
          cp packaging/silisten.svg "$APPDIR/silisten.svg"

      - name: Fetch AppImage tools
        run: |
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool

      - name: Version
        run: echo "VERSION=$(echo "${GITHUB_REF_NAME#v}" | tr -cd '0-9A-Za-z._-')" >> "$GITHUB_ENV"

      - name: Build AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui-qt/qml
          EXTRA_QT_MODULES: core;gui;qml;quick;quickcontrols2;network
          QMAKE: /usr/lib/qt6/bin/qmake6
          QT_SELECT: qt6
          PATH: /usr/lib/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          QML2_IMPORT_PATH: /usr/lib/x86_64-linux-gnu/qt6/qml
        run: |
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/silisten-qt \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/silisten.desktop \
            --icon-file AppDir/silisten.svg
          ./appimagetool AppDir "Silisten-${VERSION:-dev}-x86_64.AppImage"

      - name: Check the AppImage is self-consistent
        run: |
          APPIMAGE=$(ls Silisten-*-x86_64.AppImage)
          ./"$APPIMAGE" --appimage-extract > /dev/null
          LIBDIR="$(dirname "$(find squashfs-root -name 'libQt6Core.so.6' | head -1)")"
          echo "bundled Qt in $LIBDIR"
          if LD_LIBRARY_PATH="$LIBDIR" ldd squashfs-root/usr/bin/silisten-qt | grep -q "not found"; then
            echo "missing libraries:"
            LD_LIBRARY_PATH="$LIBDIR" ldd squashfs-root/usr/bin/silisten-qt | grep "not found"
            exit 1
          fi
          VERSION=$(strings "$LIBDIR/libQt6Core.so.6" | grep -oE "^6\.[0-9]+\.[0-9]+$" | head -1)
          echo "Qt $VERSION resolves cleanly"
          for MOD in QtQuick QtQuick/Controls QtQuick/Layouts QtQuick/Dialogs QtQuick/Window; do
            test -d "squashfs-root/usr/qml/$MOD" || { echo "missing QML module $MOD"; exit 1; }
          done
          for LIB in libQt6Qml.so.6 libQt6QmlWorkerScript.so.6 libQt6Quick.so.6 libQt6QuickControls2.so.6; do
            find squashfs-root -name "$LIB" | grep -q . || { echo "missing $LIB"; exit 1; }
          done
          echo "QML modules and libraries present"

      - name: Source archive
        run: |
          NAME="Silisten-${VERSION:-dev}-source"
          rm -rf "/tmp/$NAME"
          mkdir -p "/tmp/$NAME"
          tar -c --exclude=.git --exclude=.venv --exclude=AppDir --exclude=ui-qt/build \
                 --exclude='*.AppImage' --exclude='*.tar.gz' --exclude='*.zip' \
                 --exclude=__pycache__ . | tar -x -C "/tmp/$NAME"
          tar -czf "$NAME.tar.gz" -C /tmp "$NAME"
          (cd /tmp && zip -qr "$OLDPWD/$NAME.zip" "$NAME")
          ls -la "$NAME.tar.gz" "$NAME.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Silisten-*-x86_64.AppImage
            Silisten-*-source.tar.gz
            Silisten-*-source.zip
          generate_release_notes: true

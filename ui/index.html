<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Silisten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="notch" data-state="idle" aria-live="polite">
  <header class="head">
    <div class="title-line">
      <span id="title">Listening</span>
      <canvas id="equalizer" aria-hidden="true"></canvas>
    </div>
    <div class="tools">
      <span id="timer" class="timer"></span>
      <button id="gear" class="icon" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 3.4v2.2M12 18.4v2.2M4.8 7.8l1.9 1.1M17.3 15.1l1.9 1.1M4.8 16.2l1.9-1.1M17.3 8.9l1.9-1.1"></path>
        </svg>
      </button>
      <button id="close" class="icon" aria-label="Hide" title="Hide (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path>
        </svg>
      </button>
    </div>
  </header>

  <section id="pane-listening" class="pane">
    <p id="partial" class="partial">Speak whenever you're ready</p>
  </section>

  <section id="pane-working" class="pane">
    <p id="phase" class="phase">Transcribing</p>
    <div class="track"><div id="fill"></div></div>
  </section>

  <section id="pane-result" class="pane">
    <div id="transcript" class="transcript"></div>
    <footer class="actions">
      <button id="copy" class="primary">Copy all</button>
      <button id="more" class="secondary">Talk more</button>
      <button id="file" class="secondary">Upload file</button>
      <span id="stats" class="stats"></span>
    </footer>
  </section>

  <section id="pane-error" class="pane">
    <p id="errormsg" class="errormsg"></p>
    <p class="errortip">Press Esc to dismiss.</p>
  </section>

  <section id="pane-settings" class="pane settings" hidden>
    <label class="field">
      <span class="label">Shortcut</span>
      <input id="shortcut" type="text" spellcheck="false" autocomplete="off" placeholder="Shift+Tab+Q">
    </label>
    <label class="field">
      <span class="label">Language</span>
      <select id="language">
        <option value="">Auto-detect</option>
        <option value="en">English</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="nl">Dutch</option>
        <option value="pl">Polish</option>
        <option value="ru">Russian</option>
        <option value="uk">Ukrainian</option>
        <option value="tr">Turkish</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese</option>
      </select>
    </label>
    <label class="check">
      <input id="diarize" type="checkbox">
      <span>Identify speakers</span>
    </label>
    <div id="health" class="health"></div>
    <p id="settings-note" class="note-line"></p>
    <div class="settings-actions">
      <button id="save" class="primary">Save</button>
      <button id="cancel" class="secondary">Cancel</button>
    </div>
  </section>

  <div id="drop" class="drop" aria-hidden="true">Drop to transcribe</div>
</section>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Silisten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="notch" data-state="idle" aria-live="polite">
  <header class="head">
    <div class="title-line">
      <span id="title">Listening</span>
    </div>
    <div class="tools">
      <span id="timer" class="timer"></span>
      <button id="gear" class="icon" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 3.4v2.2M12 18.4v2.2M4.8 7.8l1.9 1.1M17.3 15.1l1.9 1.1M4.8 16.2l1.9-1.1M17.3 8.9l1.9-1.1"></path>
        </svg>
      </button>
      <button id="close" class="icon" aria-label="Hide" title="Hide (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path>
        </svg>
      </button>
    </div>
  </header>

  <section id="pane-listening" class="pane">
    <div class="rec-time" id="rec-time">0:00</div>
    <canvas id="waveform" aria-hidden="true"></canvas>
    <div class="listening-bar">
      <button id="stop" class="primary stop">Done</button>
      <div class="inline-language">
        <button class="lang-button" data-menu="input-menu" aria-haspopup="listbox" aria-expanded="false">
          <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path>
          </svg>
          <span>Default mic</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M7 14l5-5 5 5"></path>
          </svg>
        </button>
        <ul id="input-menu" class="language-menu" role="listbox" aria-label="Microphone" hidden></ul>
      </div>
      <div class="inline-language">
        <button class="lang-button" data-menu="language-menu" aria-haspopup="listbox" aria-expanded="false">
          <span>Auto</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M7 14l5-5 5 5"></path>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <section id="pane-working" class="pane">
    <p id="phase" class="phase">Transcribing</p>
    <div class="track"><div id="fill"></div></div>
  </section>

  <section id="pane-result" class="pane">
    <div id="transcript" class="transcript"></div>
    <footer class="actions">
      <button id="copy" class="primary">Copy all</button>
      <button id="more" class="secondary">Talk more</button>
      <button id="file" class="secondary">Upload file</button>
      <div class="inline-language">
        <button class="lang-button" data-menu="language-menu" aria-haspopup="listbox" aria-expanded="false">
          <span>Auto</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M7 14l5-5 5 5"></path>
          </svg>
        </button>
        <ul id="language-menu" class="language-menu" role="listbox" aria-label="Recognition language" hidden></ul>
      </div>
      <span id="stats" class="stats"></span>
    </footer>
  </section>

  <section id="pane-error" class="pane">
    <p id="errormsg" class="errormsg"></p>
    <p class="errortip">Press Esc to dismiss.</p>
  </section>

  <section id="pane-settings" class="pane settings" hidden>
    <label class="check">
      <input id="diarize" type="checkbox">
      <span>Identify speakers</span>
    </label>
    <div id="health" class="health"></div>
    <p id="settings-note" class="note-line"></p>
    <div class="settings-actions">
      <button id="save" class="primary">Save</button>
      <button id="cancel" class="secondary">Close</button>
    </div>
  </section>

  <div id="drop" class="drop" aria-hidden="true">Drop to transcribe</div>
</section>
<script src="app.js"></script>
</body>
</html>
